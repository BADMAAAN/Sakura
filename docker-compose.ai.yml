services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/config/litellm.yaml", "--port", "4000"]
    ports: ["4000:4000"]
    volumes: ["./ai/config:/config:ro"]
    environment: ["OLLAMA_API_BASE=http://host.docker.internal:11434"]
  openhands-runner:
    image: docker.openhands.dev/openhands/openhands:1.15
    profiles: ["openhands"]
    working_dir: /workspace
    volumes: ["${FLUX_ROOT:-.}:/workspace:rw"]
    environment: ["LLM_BASE_URL=http://host.docker.internal:4000/v1", "LLM_MODEL=flux-coder"]
