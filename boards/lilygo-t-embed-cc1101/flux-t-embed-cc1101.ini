[env:flux-t-embed-cc1101]
extends = env:lilygo-t-embed-cc1101
build_unflags =
	-DFLUX_VERSION='"dev"'
build_flags =
	${env:lilygo-t-embed-cc1101.build_flags}
	-DFLUX_BUILD=1
	-DFLUX_EMBEDDED_BRANDING=1
	-DFLUX_CLEAN_UI=1
	-DFLUX_VERSION='"0.1.0-dev"'
	-DFLUX_HIDE_NRF24=1
	-DFLUX_HIDE_FM=1
	-DFLUX_HIDE_GPS=1
custom_firmware_name = FLUX-T-Embed-CC1101-Plus
# Bruce's custom_16Mb.csv gives the factory app 0x470000 bytes. Keep the
# PlatformIO guard aligned with that partition so an oversized image cannot be
# flashed and leave the board in a boot loop.
board_upload.maximum_size = 4653056
extra_scripts =
	${env.extra_scripts}
	pre:scripts/embed_flux_branding.py
