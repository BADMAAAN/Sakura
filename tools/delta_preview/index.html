<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>FLUX DELTA · shared renderer</title>
<style>body{margin:0;background:#111216;color:#eee;font:14px system-ui,sans-serif}main{max-width:1280px;margin:24px auto;padding:0 20px}h1{font-size:20px;font-weight:500;margin:0 0 6px}p{color:#aca9b1;margin:8px 0 22px}img{display:block;width:100%;height:auto;image-rendering:pixelated;background:#080b10}fieldset{border:0;margin:20px 0 8px;padding:0;display:flex;gap:20px;flex-wrap:wrap;align-items:center}select,button{background:#25252d;color:#eee;border:1px solid #66616c;padding:7px;font:inherit}label{display:flex;gap:8px;align-items:center}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #edb5c9;outline-offset:3px}#activation{min-height:24px;color:#dbc0cb}footer{font-size:12px;color:#96909b}</style>
<main><h1>FLUX DELTA</h1><p>320 × 170 · the firmware’s C++ renderer and exact indexed artwork. Simulated clock, battery and radio status.</p><img id="screen" width="320" height="170" alt="Dark Sakura scene with a single selected category">
<fieldset><label>Theme <select id="theme"><option value="0">Dark Sakura</option><option value="1">Sakura Dawn</option><option value="2">Monochrome</option></select></label><label>Petals <select id="petals"><option value="0">Off</option><option value="1">Low</option><option value="2" selected>Normal</option><option value="3">High</option></select></label><label>Quality <select id="quality"><option value="0">Low</option><option value="1" selected>Balanced</option><option value="2">High</option></select></label><label><input id="reduced" type="checkbox">Reduced motion</label><label><input id="glitch" type="checkbox">Subtle glitch</label><label><input id="ambient" type="checkbox">Ambient clock</label><label>Transition <select id="speed"><option>140</option><option selected>160</option><option>180</option></select> ms</label><label><input id="icons" type="checkbox" checked>Icons</label><label><input id="status" type="checkbox" checked>Status</label></fieldset>
<fieldset><button id="prev" aria-label="Previous section">←</button><button id="next" aria-label="Next section">→</button><button id="open">Open section</button><button id="back">Back</button></fieldset><div id="activation" role="status" aria-live="polite"></div><footer>Arrows rotate · Enter requests the selected section · Esc returns · Hardware applications run on LilyGO. This preview does not emulate radios or transmit.</footer></main>
<script>const names=['Wi-Fi','Bluetooth','RF','LoRa','Infrared','Ethernet','RFID / NFC','Files','Scripts','Clock','Tools','Settings','Favorites'];let selected=0,previous=0,changed=0,direction=1,origin=performance.now();const $=s=>document.getElementById(s),clock=()=>Math.floor(performance.now()-origin);function move(d){previous=selected;selected=(selected+d+13)%13;direction=d;changed=clock();$('activation').textContent='';$('screen').alt='Sakura scene: '+names[selected]}function openSection(){$('activation').textContent='SIMULATED section request: '+names[selected]+'. Hardware application is available on LilyGO.'}function back(){$('activation').textContent='Returned to '+names[selected]}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('open').onclick=openSection;$('back').onclick=back;document.addEventListener('keydown',e=>{if(/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();move(-1)}if(e.key==='Enter')openSection();if(e.key==='Escape')back()});let old;async function draw(){let q=new URLSearchParams({selected,previous,changed,direction,now:clock(),icons:1,status:1});for(let id of ['theme','petals','quality','speed'])q.set(id,$(id).value);for(let id of ['reduced','glitch','ambient','icons','status'])q.set(id,$(id).checked?1:0);try{let blob=await(await fetch('/frame?'+q)).blob(),url=URL.createObjectURL(blob);$('screen').src=url;if(old)URL.revokeObjectURL(old);old=url}catch(e){$('activation').textContent='Preview connection interrupted.'}requestAnimationFrame(draw)}draw();</script></html>
